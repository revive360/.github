<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="286" height="56" viewBox="0 0 286 56" role="img" aria-label="Bring your app"><title>Bring your app</title><style>@font-face{font-family:'mont';src:url(data:font/woff2;base64,) format('woff2')}
.w{fill:none;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:rise 4.2s ease-out infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.85);opacity:0}18%{opacity:.85}100%{transform:translateY(-70px) scale(1.25);opacity:0}}
.sp{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.w,.sp{animation:none}.w{opacity:.6}}
</style><rect x="1" y="1" width="284" height="54" rx="28" fill="#eef1ec"/><circle cx="30" cy="28" r="13.0" fill="#7dff3c" opacity=".16"/><circle cx="30" cy="28" r="5" fill="#7dff3c"/><circle cx="28.5" cy="26.25" r="1.75" fill="#fff" opacity=".7"/><text x="156.0" y="35" text-anchor="middle" font-family="mont" font-size="19" fill="#101211">BRING YOUR APP  →</text></svg>
