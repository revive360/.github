name: App proposal
description: Bring something new / Traz algo novo / Trae algo nuevo
labels: [enhancement]
body:
  - type: dropdown
    id: level
    attributes:
      label: Requested level
      options:
        - Revive360 Project (org repository)
        - Reviewed version (external author repository)
        - Community list (unverified, no badge)
    validations:
      required: true
  - type: textarea
    id: release
    attributes:
      label: Version, source commit, artifact URL and SHA-256 (required for review)
      description: Include dependency/build provenance, console test evidence for this exact binary, and author consent. External
        reviews are FIFO, target 14 days; membership is not a badge.
  - type: markdown
    attributes:
      value: Bring a working slice and tell us what it adds. / Traz uma parte rodando e mostra o diferencial. / Trae una parte
        que funcione y qué aporta. Take early ideas to Discussions. Formal admission follows GOVERNANCE.md; no piracy or leaked
        material.
  - type: textarea
    id: idea
    attributes:
      label: What does the app do, and who needs it?
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: What does this add or do better?
      description: Link existing alternatives and explain the concrete difference. / Clone de clone fica de fora. / Un clon
        sin mejora no basta.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Who owns the app? Link the source.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Proposed license, dependencies and their sources/licenses
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Show it running on a real 360
      description: Model/setup, source commit, artifact hash and log/photo/video or another hardware record. A build alone
        is not evidence.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Agreement
      options:
        - label: I accept the organization rules and am authorized to propose this project's entry.
          required: true
