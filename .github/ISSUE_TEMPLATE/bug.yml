name: Bug report
description: Show us where it broke / Mostra onde quebrou / Muestra dónde falló
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Show the steps and the evidence. / Mostra o caminho e o registro. / Trae los pasos y la prueba. Use your language.
        File app bugs in that app’s repo. Remove credentials and personal data.
  - type: input
    id: revision
    attributes:
      label: Project and version / Projeto e versão / Proyecto y versión
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What did you do, what should happen, what actually happened?
      description: Give us a short reproducer. / Manda o passo a passo. / Deja pasos que podamos repetir.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: What were you running? Bring the record.
      description: Console model/setup, version/source/hash, and log/photo/video. For PC or tooling issues, name that environment.
        No keys or unlock payloads.
    validations:
      required: true
